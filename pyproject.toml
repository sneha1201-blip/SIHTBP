[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicte-cyber-forensics-platform"
version = "2.0.0"
description = "AI-Powered Email Threat Detection, GeoLocation and Forensic Intelligence Platform (SIH ID: 26106)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "extract-msg>=0.48.0",
    "dnspython>=2.6.0",
    "dkimpy>=1.1.5",
    "pyspf>=2.0.14",
    "geoip2>=4.8.0",
    "reportlab>=4.1.0",
    "beautifulsoup4>=4.12.0",
    "idna>=3.6",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "alembic>=1.13.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore::pytest_asyncio.plugin.PytestDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "node_modules",
    "backend/alembic",
    "storage",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "^backend/alembic/",
    "^\\.venv/",
    "^node_modules/",
    "^storage/",
]

