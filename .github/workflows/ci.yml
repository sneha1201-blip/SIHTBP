name: CI / Verification Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-qa:
    name: Backend Lint, Typing & Forensic Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff Linter Check
        run: |
          ruff check .

      - name: Mypy Static Type Verification
        run: |
          mypy backend/app

      - name: Execute Pytest Suite (Async & Cryptographic Vault)
        run: |
          pytest -v backend/tests/

      - name: End-to-End System Verification
        run: |
          python verify_system.py

  frontend-qa:
    name: Frontend Lint, Type-Check & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: ESLint Check
        run: npm run lint

      - name: TypeScript Type-Check
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build

  docker-smoke-test:
    name: Docker Compose Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Environment File
        run: |
          cp .env.example .env
          sed -i 's/replace_with_64_char_hex_hmac_secret_key/0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/' .env
          sed -i 's/replace_with_cryptographically_secure_jwt_secret/jwt_ci_super_secret_key_32_characters_long_min/' .env

      - name: Build and Start Containers
        run: |
          docker compose up -d --build

      - name: Wait and Verify Backend Health
        run: |
          timeout 60 bash -c 'until docker compose ps | grep -q "healthy"; do sleep 3; done' || (docker compose logs && exit 1)
          docker compose ps
          curl -f http://localhost:8000/health

      - name: Teardown Containers
        if: always()
        run: docker compose down -v

